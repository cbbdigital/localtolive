<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galerie · Ciprian Badic</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{--ink:#1a1a1a;--muted:#9a9a9a;--line:#e7e7e7;--bg:#ffffff}
html,body{margin:0}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;line-height:1.5}
a{color:inherit}
button{font-family:inherit;cursor:pointer}

.wrap{max-width:1180px;margin:0 auto;padding:clamp(24px,4vw,56px) clamp(20px,4vw,56px) 80px}
.brand{font-weight:600;letter-spacing:.18em;font-size:14px;margin-bottom:2px}
.brand small{display:block;font-weight:400;letter-spacing:.13em;font-size:9px;color:var(--muted);margin-top:4px;text-transform:uppercase}
.h-title{font-size:clamp(24px,2.6vw,32px);font-weight:600;letter-spacing:-.01em;margin:34px 0 6px}
.sub{font-size:13.5px;color:var(--muted);margin:0 0 22px}
.badge{display:inline-block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;padding:5px 11px;border-radius:20px;margin-bottom:22px}
.badge.preview{background:#f4f4f2;color:#6a6a6a}
.badge.download{background:#eaf6ee;color:#1a7f37}
.note{font-size:12px;color:var(--muted);font-weight:300;max-width:560px;margin:0 0 28px}

.g-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.g-tile{position:relative;aspect-ratio:3/2;background-size:cover;background-position:center;overflow:hidden;border-radius:2px;background-color:#f1f1ef;cursor:zoom-in}
.g-tile img{width:100%;height:100%;object-fit:cover;display:block;user-select:none;-webkit-user-drag:none}
.g-dl{position:absolute;bottom:8px;right:8px;background:rgba(255,255,255,.94);color:var(--ink);border:none;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:8px 13px;border-radius:3px;opacity:0;transition:opacity .15s}
.g-tile:hover .g-dl{opacity:1}
@media (max-width:640px){ .g-dl{opacity:1} }

.top-actions{display:flex;justify-content:flex-end;margin-bottom:18px}
.btn-dark{background:var(--ink);color:#fff;border:none;padding:13px 26px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;transition:opacity .18s}
.btn-dark:hover{opacity:.82}
.btn-dark:disabled{opacity:.45;cursor:default}

.state{padding:100px 0;text-align:center;color:var(--muted);font-size:14px}
.foot{margin-top:60px;font-size:11px;color:var(--muted);text-align:center}

.lightbox{position:fixed;inset:0;background:rgba(8,8,8,.94);z-index:200;display:flex;align-items:center;justify-content:center;padding:28px;cursor:zoom-out}
.lightbox .lb-body{max-width:100%;max-height:100%;display:flex;align-items:center;justify-content:center;cursor:default}
.lightbox .lb-body img{max-width:100%;max-height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
.lightbox .lb-body img.rot-90{transform:rotate(90deg);max-width:calc(100vh - 56px);max-height:calc(100vw - 56px)}
.lightbox .lb-body img.rot-180{transform:rotate(180deg)}
.lightbox .lb-body img.rot-270{transform:rotate(270deg);max-width:calc(100vh - 56px);max-height:calc(100vw - 56px)}
.lightbox .lb-loading{color:#eee;font-size:13px}
.lightbox .lb-close{position:absolute;top:18px;right:24px;color:#fff;font-size:28px;line-height:1;background:none;border:none;cursor:pointer;opacity:.8;z-index:2}
.lightbox .lb-close:hover{opacity:1}
.lightbox .lb-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.12);color:#fff;border:none;font-size:30px;width:52px;height:52px;border-radius:50%;cursor:pointer;opacity:.75;display:flex;align-items:center;justify-content:center;z-index:2}
.lightbox .lb-nav:hover{opacity:1;background:rgba(255,255,255,.22)}
.lightbox .lb-prev{left:16px}
.lightbox .lb-next{right:16px}
@media (max-width:640px){ .lightbox .lb-nav{width:42px;height:42px;font-size:24px} }
</style>
</head>
<body>

<div class="wrap">
  <div class="brand">CIPRIAN BADIC<small>Fotografie de arhitectură</small></div>
  <div id="app"><div class="state">Se încarcă galeria…</div></div>
  <div class="foot">© Ciprian Badic — toate imaginile sunt protejate prin drepturi de autor.</div>
</div>

<script>
const SUPABASE_URL = 'https://kowvuvieclbpyoszswjo.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtvd3Z1dmllY2xicHlvc3pzd2pvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNDI1MjgsImV4cCI6MjEwMjcxODUyOH0.JlzPHP-9OjGLTDLWi2UtbWBGHpmoBnnRhdfTBgOzoIw';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const BUCKET = 'photocrm-photos';

const params = new URLSearchParams(location.search);
const slug = (params.get('c')||'').trim();
const token = (params.get('t')||'').trim();

function escHtml(s){ return (s||'').replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function publicUrl(path){ return sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl; }

async function loadWatermarked(url, maxDim=1280){
  return new Promise(resolve=>{
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = ()=>{
      try{
        let w=img.naturalWidth, h=img.naturalHeight;
        if(w>h){ if(w>maxDim){h=Math.round(h*maxDim/w); w=maxDim;} }
        else{ if(h>maxDim){w=Math.round(w*maxDim/h); h=maxDim;} }
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,w,h);
        ctx.save();
        ctx.globalAlpha = 0.14;
        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.translate(w/2, h/2);
        ctx.rotate(-Math.PI/9);
        const mainSize = Math.max(14, Math.round(w*0.05));
        const subSize = Math.max(9, Math.round(w*0.022));
        const stepX = w*0.62, stepY = h*0.34;
        for(let y=-h; y<h*2; y+=stepY){
          for(let x=-w; x<w*2; x+=stepX){
            const cx = x-w/2, cy = y-h/2;
            ctx.font = `600 ${mainSize}px Inter, sans-serif`;
            ctx.fillText('CIPRIAN BADIC', cx, cy);
            ctx.font = `500 ${subSize}px Inter, sans-serif`;
            ctx.fillText('FOTOGRAFIE DE ARHITECTURA', cx, cy + mainSize*0.85);
          }
        }
        ctx.restore();
        resolve(canvas.toDataURL('image/jpeg', 0.86));
      }catch(e){
        resolve(url); // CORS or canvas failure fallback: show original (still no download offered)
      }
    };
    img.onerror = ()=>resolve(url);
    img.src = url;
  });
}

async function downloadBlob(url, filename){
  try{
    const res = await fetch(url);
    const blob = await res.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  }catch(e){
    window.open(url, '_blank');
  }
}

function baseName(client){
  return (client.slug||'poze').toLowerCase();
}

function extFromPath(path){
  const m = /\.([a-zA-Z0-9]+)$/.exec(path||'');
  return m ? m[1].toLowerCase() : 'jpg';
}

async function downloadAllZip(client, photos, btn){
  const old = btn.textContent;
  btn.disabled = true;
  try{
    const zip = new JSZip();
    for(let i=0;i<photos.length;i++){
      btn.textContent = `Se pregătește ${i+1}/${photos.length}…`;
      const res = await fetch(photos[i].downloadSrc);
      const blob = await res.blob();
      const num = String(i+1).padStart(2,'0');
      zip.file(`${baseName(client)}-${num}.${photos[i].ext}`, blob);
    }
    btn.textContent = 'Se arhivează…';
    const content = await zip.generateAsync({type:'blob'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(content);
    a.download = `${baseName(client)}-poze.zip`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  }catch(e){
    alert('Eroare la arhivare: '+e.message);
  }finally{
    btn.disabled = false;
    btn.textContent = old;
  }
}

function renderState(html){
  document.getElementById('app').innerHTML = html;
}

let lbPhotos = [];
let lbMode = 'preview';
let lbIndex = 0;
let lbOverlay = null;
let lbLoadToken = 0;

function closeLightbox(){
  if(lbOverlay){ lbOverlay.remove(); lbOverlay = null; }
  document.removeEventListener('keydown', onLbKey);
}

function onLbKey(e){
  if(e.key==='Escape') closeLightbox();
  else if(e.key==='ArrowLeft') navLightbox(-1);
  else if(e.key==='ArrowRight') navLightbox(1);
}

function navLightbox(dir){
  if(!lbOverlay || lbPhotos.length<2) return;
  lbIndex = (lbIndex + dir + lbPhotos.length) % lbPhotos.length;
  renderLightboxContent();
}

async function renderLightboxContent(){
  const myToken = ++lbLoadToken;
  const body = lbOverlay.querySelector('.lb-body');
  body.innerHTML = '<div class="lb-loading">Se încarcă…</div>';
  const photo = lbPhotos[lbIndex];
  const rotClass = photo.rotation ? `rot-${photo.rotation}` : '';
  if(lbMode === 'download'){
    body.innerHTML = `<img class="${rotClass}" src="${photo.downloadSrc}">`;
  }else{
    const big = await loadWatermarked(photo.previewSrc, 1800);
    if(myToken === lbLoadToken && lbOverlay){
      body.innerHTML = `<img class="${rotClass}" src="${big}" oncontextmenu="return false">`;
    }
  }
}

function openLightbox(photos, index, mode){
  lbPhotos = photos; lbIndex = index; lbMode = mode;
  lbOverlay = document.createElement('div');
  lbOverlay.className = 'lightbox';
  lbOverlay.innerHTML = `
    <button class="lb-close" type="button">×</button>
    ${photos.length>1 ? '<button class="lb-nav lb-prev" type="button">‹</button><button class="lb-nav lb-next" type="button">›</button>' : ''}
    <div class="lb-body"></div>
  `;
  lbOverlay.addEventListener('click', (e)=>{ if(e.target===lbOverlay) closeLightbox(); });
  lbOverlay.querySelector('.lb-close').addEventListener('click', closeLightbox);
  if(photos.length>1){
    lbOverlay.querySelector('.lb-prev').addEventListener('click', (e)=>{ e.stopPropagation(); navLightbox(-1); });
    lbOverlay.querySelector('.lb-next').addEventListener('click', (e)=>{ e.stopPropagation(); navLightbox(1); });
  }
  let touchStartX = null;
  lbOverlay.addEventListener('touchstart', e=>{ touchStartX = e.touches[0].clientX; });
  lbOverlay.addEventListener('touchend', e=>{
    if(touchStartX===null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    if(Math.abs(dx) > 40) navLightbox(dx>0 ? -1 : 1);
    touchStartX = null;
  });
  document.addEventListener('keydown', onLbKey);
  document.body.appendChild(lbOverlay);
  renderLightboxContent();
}

async function init(){
  if(!slug){
    renderState('<div class="state">Link invalid.</div>');
    return;
  }

  const { data: client, error } = await sb.from('photocrm_clients')
    .select('id, slug, client_name, project_name')
    .eq('slug', slug)
    .maybeSingle();

  if(error || !client){
    renderState('<div class="state">Galeria nu a fost găsită. Verifică linkul primit.</div>');
    return;
  }

  const isDownload = !!token;
  let validDownload = false;
  if(isDownload){
    const { data: dlCheck } = await sb.from('photocrm_clients')
      .select('id')
      .eq('slug', slug)
      .eq('download_token', token)
      .maybeSingle();
    validDownload = !!dlCheck;
  }

  const { data: photoRows } = await sb.from('photocrm_photos')
    .select('id, storage_path, original_path, rotation')
    .eq('client_id', client.id)
    .order('position', {ascending:true});

  const photos = (photoRows||[]).map(p=>({
    id: p.id,
    previewSrc: publicUrl(p.storage_path),
    downloadSrc: p.original_path ? publicUrl(p.original_path) : publicUrl(p.storage_path),
    ext: p.original_path ? extFromPath(p.original_path) : 'jpg',
    rotation: p.rotation || 0
  }));

  const title = client.project_name || client.client_name;

  let html = `<h1 class="h-title">${escHtml(title)}</h1>`;

  if(!photos.length){
    html += '<div class="state">Nicio fotografie încărcată încă.</div>';
    renderState(html);
    return;
  }

  if(validDownload){
    html += `<div class="top-actions"><button class="btn-dark" id="zipAllBtn">Descarcă tot (.zip)</button></div>`;
    html += '<div class="g-grid" id="gGrid">' + photos.map((p,i)=>`
      <div class="g-tile" data-i="${i}" style="${p.rotation ? `transform:rotate(${p.rotation}deg)` : ''}">
        <img src="${p.previewSrc}" loading="lazy">
        <button class="g-dl" data-i="${i}">Descarcă</button>
      </div>`).join('') + '</div>';
    renderState(html);
    document.getElementById('zipAllBtn').addEventListener('click', function(){ downloadAllZip(client, photos, this); });
    document.querySelectorAll('.g-tile').forEach(tile=>{
      tile.addEventListener('click', function(){
        const i = Number(this.dataset.i);
        openLightbox(photos, i, 'download');
      });
    });
    document.querySelectorAll('.g-dl').forEach(btn=>{
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        const i = Number(this.dataset.i);
        const num = String(i+1).padStart(2,'0');
        downloadBlob(photos[i].downloadSrc, `${baseName(client)}-${num}.${photos[i].ext}`);
      });
    });
    sb.rpc('photocrm_track_download_view', { p_slug: slug, p_token: token }).then(()=>{}).catch(()=>{});
  }else{
    html += '<div class="g-grid" id="gGrid">' + photos.map((_,i)=>`
      <div class="g-tile" id="tile-${i}" data-i="${i}" oncontextmenu="return false"></div>`).join('') + '</div>';
    renderState(html);
    photos.forEach(async (p, i)=>{
      const dataUrl = await loadWatermarked(p.previewSrc, 1280);
      const el = document.getElementById(`tile-${i}`);
      if(el){
        el.style.backgroundImage = `url('${dataUrl}')`;
        if(p.rotation) el.style.transform = `rotate(${p.rotation}deg)`;
      }
    });
    document.querySelectorAll('.g-tile').forEach(tile=>{
      tile.addEventListener('click', function(){
        const i = Number(this.dataset.i);
        openLightbox(photos, i, 'preview');
      });
    });
    document.addEventListener('dragstart', e=>e.preventDefault());
    sb.rpc('photocrm_track_client_view', { p_slug: slug }).then(()=>{}).catch(()=>{});
  }
}

init();
</script>
</body>
</html>
