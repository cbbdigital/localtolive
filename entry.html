<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Local to Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#ff453a; --blue:#2997ff; --card:#1a1a1c; --ink:#f5f5f7;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#000;font-family:'Space Grotesk',system-ui,sans-serif;color:var(--ink)}

/* ===== STAGE ===== */
.stage{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(120% 90% at 50% 42%,#141416 0%,#0a0a0b 45%,#000 100%);
  perspective:1600px;
}

/* ===== DEVICE (Mac Studio Display) ===== */
.device{
  position:relative;
  /* start: screen fills the whole viewport → zoom out to fit */
  transform:scale(3.05) translateY(6.2%);
  will-change:transform;
  transition:transform 2400ms cubic-bezier(.7,.02,.16,1);
}
.device.zoomed{ transform:scale(1) translateY(0); }

.bezel{
  position:relative;width:76vmin;max-width:920px;aspect-ratio:16/10;
  background:linear-gradient(145deg,#2a2a2d,#141416);
  border-radius:16px;padding:1.15%;
  box-shadow:0 40px 120px rgba(0,0,0,.7), inset 0 0 0 1px rgba(255,255,255,.06);
  opacity:0;transition:opacity 1400ms ease 700ms;
}
.device.zoomed .bezel{opacity:1}
.screen{
  position:relative;width:100%;height:100%;border-radius:8px;overflow:hidden;
  background:#000;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);
}
.notch{
  position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:14%;height:4.5%;background:#141416;border-radius:0 0 8px 8px;z-index:6;
  opacity:0;transition:opacity 600ms ease 1600ms;
}
.device.zoomed .notch{opacity:1}

/* stand + foot */
.stand{
  position:absolute;left:50%;bottom:-9.5%;transform:translateX(-50%) scaleY(0);
  transform-origin:top center;
  width:12%;height:10%;
  background:linear-gradient(90deg,#3a3a3d,#5a5a5e 45%,#3a3a3d);
  border-radius:0 0 4px 4px;
  transition:transform 900ms cubic-bezier(.6,0,.2,1) 900ms;
}
.foot{
  position:absolute;left:50%;bottom:-11%;transform:translateX(-50%) scale(0);
  width:34%;height:2.4%;border-radius:40px;
  background:linear-gradient(90deg,#2c2c2f,#6a6a6e,#2c2c2f);
  box-shadow:0 18px 40px rgba(0,0,0,.6);
  transition:transform 800ms cubic-bezier(.6,0,.2,1) 1250ms;
}
.device.zoomed .stand{transform:translateX(-50%) scaleY(1)}
.device.zoomed .foot{transform:translateX(-50%) scale(1)}

/* ===== SCREEN CONTENT (video-style, not a video) ===== */
.reel{position:absolute;inset:0;display:flex;flex-direction:column;
  background:#000;overflow:hidden}
/* red-room ambient glow */
.reel::before{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(60% 45% at 50% 30%,rgba(255,69,58,.55),transparent 70%),
    radial-gradient(80% 60% at 50% 120%,rgba(255,69,58,.25),transparent 70%),
    #0c0708;
  animation:breathe 5s ease-in-out infinite;
}
@keyframes breathe{0%,100%{opacity:.9;transform:scale(1)}50%{opacity:1;transform:scale(1.04)}}
/* light beams */
.reel::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(105deg,transparent 44%,rgba(255,255,255,.10) 50%,transparent 56%),
    repeating-linear-gradient(90deg,rgba(255,255,255,.02) 0 2px,transparent 2px 46px);
  mix-blend-mode:screen;
  animation:sweep 6s linear infinite;
}
@keyframes sweep{0%{background-position:-60% 0,0 0}100%{background-position:160% 0,46px 0}}

.reel-inner{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;gap:2.2%;padding:4%}

.brand{font-weight:700;letter-spacing:-.02em;font-size:clamp(20px,5.2vmin,64px);line-height:1;display:inline-flex;align-items:center;gap:.12em}
.brand .lc{color:#fff}
.brand .to{color:#9a9a9f;font-weight:500;font-size:.5em;align-self:center}
.brand .dot{width:.16em;height:.16em;border-radius:50%;background:var(--red);
  box-shadow:0 0 .5em var(--red);animation:pulse 1.4s ease-in-out infinite}
.brand .lv{color:var(--red)}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.5);opacity:.55}}

.tagline{font-size:clamp(11px,3.1vmin,34px);font-weight:600;letter-spacing:-.01em;color:#fff}
.tagline em{font-style:normal;color:var(--blue)}
.sub{font-size:clamp(8px,1.7vmin,15px);color:#b7b7bd;max-width:60ch;line-height:1.5}

.chips{display:flex;flex-wrap:wrap;gap:.6vmin;justify-content:center;margin-top:.8%}
.chip{font-size:clamp(7px,1.5vmin,13px);font-weight:500;color:#dcdce1;
  border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:.5vmin 1.3vmin;
  background:rgba(255,255,255,.03)}

/* faux timeline / playhead – the "video" feel */
.timeline{position:absolute;left:0;right:0;bottom:0;height:12%;z-index:3;
  background:linear-gradient(0deg,rgba(0,0,0,.85),transparent);
  display:flex;align-items:flex-end;gap:1.6%;padding:0 6% 3%}
.bar{flex:1;background:linear-gradient(0deg,var(--red),#ff8079);border-radius:2px;
  opacity:.85;animation:eq 1.1s ease-in-out infinite}
@keyframes eq{0%,100%{height:22%}50%{height:80%}}
.play{position:absolute;top:0;bottom:0;width:2px;background:var(--blue);
  box-shadow:0 0 12px var(--blue);animation:scrub 6s linear infinite}
@keyframes scrub{0%{left:6%}100%{left:94%}}

/* ===== UI overlay after reveal ===== */
.enter{
  position:fixed;left:50%;bottom:6%;transform:translateX(-50%) translateY(14px);
  z-index:20;opacity:0;pointer-events:none;transition:opacity .6s ease,transform .6s ease;
  display:flex;flex-direction:column;align-items:center;gap:14px;
}
.enter.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.enter .hint{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#7d7d83}
.btn{font-family:inherit;font-weight:600;font-size:15px;color:#fff;cursor:pointer;
  border:0;padding:14px 34px;border-radius:999px;
  background:linear-gradient(90deg,var(--red),#ff6a60);
  box-shadow:0 0 0 0 rgba(41,151,255,.5);animation:glow 2.4s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 8px 30px rgba(255,69,58,.35)}50%{box-shadow:0 8px 44px rgba(41,151,255,.55)}}
.btn:hover{filter:brightness(1.08)}

.skip{position:fixed;top:22px;right:26px;z-index:20;font-size:12px;letter-spacing:.1em;
  text-transform:uppercase;color:#6a6a70;background:none;border:0;cursor:pointer;
  font-family:inherit;opacity:0;transition:opacity .5s ease .3s}
.skip.show{opacity:1}
.skip:hover{color:#fff}
</style>
</head>
<body>
<div class="stage">
  <div class="device" id="device">
    <div class="bezel">
      <div class="notch"></div>
      <div class="screen">
        <div class="reel">
          <div class="reel-inner">
            <div class="brand"><span class="lc">Local</span><span class="to">to</span><span class="dot"></span><span class="lv">Live</span></div>
            <div class="tagline">Conținut video care <em>vinde</em>.</div>
            <div class="sub">Social media & marketing digital pentru afaceri locale. De la concept și scripting până la editare și vânzări.</div>
            <div class="chips">
              <span class="chip">TikTok</span>
              <span class="chip">TikTok Ads</span>
              <span class="chip">Instagram</span>
              <span class="chip">Facebook</span>
              <span class="chip">YouTube</span>
              <span class="chip">Google Ads</span>
              <span class="chip">Scripting</span>
              <span class="chip">Final Cut Pro</span>
            </div>
          </div>
          <div class="timeline" id="tl">
            <div class="play"></div>
          </div>
        </div>
      </div>
      <div class="stand"></div>
      <div class="foot"></div>
    </div>
  </div>
</div>

<button class="skip" id="skip">Skip</button>
<div class="enter" id="enter">
  <div class="hint">Studioul tău de conținut</div>
  <button class="btn" onclick="go()">Intră în site →</button>
</div>

<script>
// build equalizer bars
const tl=document.getElementById('tl');
for(let i=0;i<40;i++){const b=document.createElement('div');b.className='bar';
  b.style.animationDelay=(-Math.random()*1.1)+'s';tl.appendChild(b);}

const device=document.getElementById('device');
const enter=document.getElementById('enter');
const skip=document.getElementById('skip');

function reveal(){
  device.classList.add('zoomed');
  setTimeout(()=>{enter.classList.add('show');skip.classList.remove('show');},2600);
}
// hold fullscreen briefly, then zoom out
const t=setTimeout(reveal,1500);
setTimeout(()=>skip.classList.add('show'),300);

skip.onclick=()=>{clearTimeout(t);reveal();};

function go(){
  // TODO: point to your real site / servicii.html
  // window.location.href='servicii.html';
  enter.querySelector('.btn').textContent='Se încarcă…';
}
</script>
</body>
</html>
